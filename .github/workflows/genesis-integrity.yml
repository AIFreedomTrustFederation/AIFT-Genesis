{
  "name": "Genesis Integrity",
  "on": {
    "push": {
      "branches": ["main"]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "genesis-integrity-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Run manifest tests",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Validate canonical manifests",
          "run": "python tools/validation/validate_tree.py\npython tools/validation/validate_atlas.py"
        },
        {
          "name": "Check deterministic Tree artifacts",
          "run": "python tools/tree/render_tree.py --check"
        }
      ]
    }
  }
}
