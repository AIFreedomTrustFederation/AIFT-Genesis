{
  "name": "Genesis Integrity",
  "on": {
    "push": {
      "branches": ["main"]
    },
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "genesis-integrity-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Check out repository",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up Python",
          "uses": "actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Run manifest tests",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Validate canonical manifests",
          "run": "python tools/validation/validate_tree.py\npython tools/validation/validate_atlas.py"
        },
        {
          "name": "Check deterministic Tree artifacts",
          "run": "python tools/tree/render_tree.py --check"
        }
      ]
    }
  }
}
